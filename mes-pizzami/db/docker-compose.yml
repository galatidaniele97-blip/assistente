# SQL Server 2022 Developer per lo sviluppo del MES Pizzami.
# Avvio:   docker compose up -d
# Script:  ./run-scripts.sh   (Linux/macOS)   oppure   .\run-scripts.ps1   (Windows)
services:
  mes-sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mes-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Pizzami!Demo2026"
      MSSQL_PID: "Developer"
      # Stessa collation tipica dei server italiani: evita sorprese nel porting.
      MSSQL_COLLATION: "Latin1_General_CI_AS"
    ports:
      - "1433:1433"
    volumes:
      - mes-sql-data:/var/opt/mssql
      # La cartella mes-pizzami e' visibile nel container in /mes (script in /mes/db, test in /mes/test)
      - ../:/mes:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  mes-sql-data:
